; SmallTV-Ultra (ESP-12F, 4 MB). Stock Ultra-V9.0.50 OTA slot is about 505 KB.
; The smalltv env must stay under that if it is uploaded directly. The loader
; env is the documented fallback when the stock updater returns "Not Enough Space".

[platformio]
default_envs = smalltv

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = +<*> -<loader.cpp>

[env:loader]
extends = env:smalltv
build_src_filter = -<*> +<loader.cpp>
build_flags =
    -D LOADER_BUILD
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
